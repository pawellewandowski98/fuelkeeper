# Pebble configuration: FuelKeeper in development mode with embedded,
# durable (Pebble/LSM) storage and mocked oracle/treasury. Nullnet-style
# (single process; never use the mock oracle/treasury in production), but
# demonstrates the single-process pebble backend instead of memory so state
# survives a restart. See docs/OPERATIONS.md's "Deployment Topologies":
# Pebble is single-process, exactly like sqlite and memory -- run exactly one
# process against a given store.pebble.path.
#
# Environment:
#   FUELKEEPER_STORE_PATH   optional: the Pebble data directory (default ./fuelkeeper-pebble).

instance:
  rescan_interval: 1s

store:
  backend: pebble
  pebble:
    path: ${FUELKEEPER_STORE_PATH:-./fuelkeeper-pebble}
    no_sync: false          # leave false in production (fsync every write batch)
    cache_bytes: 0          # 0 = pebble's own default (256 MiB)

pools:
  - name: main
    denomination: 50
    split_size: 100
    target_available: 1000
    low_water: 500
    spend_policy: trust

jobs:
  enabled: true
  lease_ttl: 10s
  reaper:
    interval: 1s
    grace: 2s
    quarantine_min_age: 2s
    min_unspent_age: 2s
  watcher:
    interval: 1s
  minter:
    interval: 2s
    max_per_round: 5
    max_pending_shards: 20

oracle:
  kind: mock
  mock:
    assume_unspent: true

treasury:
  kind: mock
  mock:
    confirm_after: 500ms

api:
  listen: "127.0.0.1:8080"

log:
  level: info
