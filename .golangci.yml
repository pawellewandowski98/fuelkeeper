version: "2"
run:
  timeout: 5m
  tests: true
linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - prealloc
    - revive
    - rowserrcheck
    - sqlclosecheck
    - testifylint
    - unconvert
    - unparam
  settings:
    govet:
      settings:
        printf:
          funcs:
            - github.com/bsv-blockchain/fuelkeeper/pkg/store.invalid
    gosec:
      excludes:
        - G404 # math/rand is fine for jitter and test data
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, noctx]
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/bsv-blockchain/fuelkeeper
