service {
	cluster-name fuelkeeper-test
	proto-fd-max 15000
}

logging {
	console {
		context any info
	}
}

network {
	service {
		address any
		port 3000
	}
	heartbeat {
		mode mesh
		port 3002
		interval 150
		timeout 10
	}
	fabric {
		port 3001
	}
}

# Development/test only. This Community Edition namespace runs in
# availability (AP) mode, which FuelKeeper refuses unless
# Config.AllowAvailabilityMode is set (the tests set it). Production needs
# an Enterprise namespace with strong-consistency true, replication-factor
# >= 2 and, to survive losing every replica at once, commit-to-device true;
# see the package doc of pkg/store/aerospike.
namespace test {
	replication-factor 1
	default-ttl 0
	nsup-period 0
	storage-engine memory {
		data-size 1G
	}
}
